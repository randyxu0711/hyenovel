[tool.pytest.ini_options]
testpaths = ["tests", "den/tests"]
# 根層模組(viz/render/export…)靠 repo 根在 sys.path 才 import 得到
pythonpath = ["."]

[tool.coverage.run]
branch = true
# 覆蓋率只量「確定性層」——純函式、無外部 SDK 接線,100% 是真的、可達、有意義。
# den/ 刻意不量:它混了 claude CLI 子行程與 HTTP 接線,
# 硬要 100% 只能靠 mock 演出來,那種測試在外部行為改版時會集體假綠。
# den 的正確性靠「行為契約逐條有測」(den/tests/)守,不靠覆蓋率數字。
#
# 注意:不能用 --cov=viz —— viz 同時是 viz.py 和 viz/ 目錄(template/css/js),
# 會被解讀成後者而收不到資料。用 include 指檔案才對。
include = [
    "viz.py",
    "export.py",
    "render.py",
    "atomicio.py",
    "marrow/*.py",
]

[tool.coverage.report]
# 只排除「本質上不可測」的行 —— 不是拿來藏測不動的邏輯。
# 若哪天想在這裡加東西,先問:那真的不可測,還是我懶得測?
exclude_lines = [
    'if __name__ == .__main__.:',   # CLI 進入點:main() 本身有測,這行只是 python 的儀式
]
